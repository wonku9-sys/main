[build-system]
requires = ["setuptools>=75,<81"]
build-backend = "setuptools.build_meta"

[project]
name = "seoyoung-pos-standalone"
version = "2.0.1"
description = "Offline Korean desktop retail management, independently designed from manual workflows"
requires-python = ">=3.12,<3.13"
dependencies = [
  "PySide6==6.8.3",
  "openpyxl==3.1.5",
  "et-xmlfile==2.0.0",
  "python-barcode==0.16.1",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.16.0", "zxing-cpp==2.3.0"]

[project.scripts]
seoyoung-standalone = "pos2.app:main"

[tool.setuptools.packages.find]
where = ["."]
include = ["pos2*"]

[tool.setuptools.package-data]
pos2 = ["assets/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
