[build-system]
requires = ["setuptools==84.0.0"]
build-backend = "setuptools.build_meta"

[project]
name = "seoyoung-pos"
version = "1.0.0"
description = "Offline Korean purchase, sales and stock desktop manager"
requires-python = ">=3.12,<3.13"
dependencies = [
    "PySide6==6.8.3",
    "openpyxl==3.1.5",
    "et-xmlfile==2.0.0",
]

[project.optional-dependencies]
dev = ["pytest==8.3.5", "pyinstaller==6.16.0"]

[project.gui-scripts]
seoyoung-pos = "seoyoung_pos.app:main"

[tool.setuptools.packages.find]
include = ["seoyoung_pos*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-ra"
