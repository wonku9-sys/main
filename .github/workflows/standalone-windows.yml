name: Independent standalone Windows release

on:
  workflow_dispatch:
  push:
    tags:
      - 'standalone-v*'

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 30
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: standalone/uv.lock
      - name: Install the exact independent application lockfile
        run: uv sync --frozen --extra dev --project standalone
      - name: Test new independent business engine and desktop
        run: uv run --frozen --extra dev --project standalone python -m pytest -q standalone/tests
      - name: Build actual Windows EXE and run its isolated smoke test
        run: uv run --frozen --extra dev --project standalone python standalone/build_portable.py
      - name: Package independent source code
        run: uv run --frozen --extra dev --project standalone python standalone/package_source.py
      - name: Preserve real frozen executable desktop capture
        uses: actions/upload-artifact@v4
        with:
          name: standalone-windows-desktop
          if-no-files-found: error
          path: standalone/dist/SeoyoungPOS-Standalone-Windows-smoke.png
      - name: Preserve verified packages
        uses: actions/upload-artifact@v4
        with:
          name: standalone-windows-x64
          if-no-files-found: error
          retention-days: 30
          path: |
            standalone/dist/SeoyoungPOS-Standalone-Windows-x64-portable.zip
            standalone/dist/SeoyoungPOS-Standalone-Windows-x64-portable.zip.sha256
            standalone/dist/SeoyoungPOS-Standalone-source.zip
            standalone/dist/SeoyoungPOS-Standalone-source.zip.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/standalone-v')
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: standalone-windows-x64
          path: release-assets
      - name: Verify both archive checksums
        working-directory: release-assets
        run: |
          sha256sum --check SeoyoungPOS-Standalone-Windows-x64-portable.zip.sha256
          sha256sum --check SeoyoungPOS-Standalone-source.zip.sha256
      - name: Publish independently named standalone release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          gh release create "$RELEASE_TAG" --verify-tag --latest --title "서영 POS 독립판 ${RELEASE_TAG#standalone-}" --notes-file standalone/RELEASE_NOTES.md release-assets/SeoyoungPOS-Standalone-Windows-x64-portable.zip release-assets/SeoyoungPOS-Standalone-Windows-x64-portable.zip.sha256 release-assets/SeoyoungPOS-Standalone-source.zip release-assets/SeoyoungPOS-Standalone-source.zip.sha256
