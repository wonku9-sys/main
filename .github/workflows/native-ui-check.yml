name: Supplemental native UI font check
on:
  push:
    branches: ['manual-purchase-rc34']
    paths:
      - 'standalone/tests/test_compact_catalog_shell.py'
      - '.github/workflows/native-ui-check.yml'
permissions:
  contents: read
jobs:
  font:
    runs-on: windows-2022
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: standalone/uv.lock
      - run: uv sync --frozen --extra dev --project standalone
      - name: Actual rendered 14 18 22 pixel fonts on Windows
        run: uv run --frozen --extra dev --project standalone python -m pytest -q standalone/tests/test_compact_catalog_shell.py -k supplier_compact_rows_never_clip_native_font
      - name: Payment confirmation completion and worker cleanup
        run: uv run --frozen --extra dev --project standalone python -m pytest -x -v --tb=long -o faulthandler_timeout=120 standalone/tests/test_payment_access_completion.py standalone/tests/test_payment_finance.py standalone/tests/test_payment_reference_skins.py standalone/tests/test_payment_access_layout.py standalone/tests/test_purchase_import.py
