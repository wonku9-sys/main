name: Native payment confirmation layout release
on:
  push:
    tags: ['payment-access-v*']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: standalone/uv.lock
      - name: Attest payment authentication and business code are unchanged
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import ast,json,subprocess
          from pathlib import Path
          tested='783f108620551651be5690aa5caf04ab74f76ed3'
          run=json.loads(subprocess.check_output(['gh','api','repos/wonku9-sys/main/actions/runs/39540512383'],text=True,encoding='utf-8'))
          assert run['head_sha']==tested and run['conclusion']=='success'
          changed=set(subprocess.check_output(['git','diff','--name-only',tested,'HEAD','--','standalone/pos2'],text=True).splitlines())
          allowed={'standalone/pos2/'+name for name in ('__init__.py','payment_access_ui.py','popup_policy.py')}
          assert changed<=allowed,changed-allowed
          def original(name):return subprocess.check_output(['git','show',tested+':'+name],text=True,encoding='utf-8')
          def current(name):return Path(name).read_text(encoding='utf-8')
          for name in ('standalone/pos2/__init__.py','standalone/pyproject.toml','standalone/uv.lock'):
              assert current(name).replace('2.4.0rc29','2.4.0rc28')==original(name),name
          for name in ('standalone/requirements.txt','standalone/build_portable.py','standalone/launch.py'):
              assert current(name)==original(name),name
          auth='standalone/pos2/payment_access_ui.py'
          added='        # This short confirmation already has Confirm/Cancel. Keep both visible\n        # without the generic popup\'s duplicate close footer or needless scroll.\n        self._sy_compact_confirmation=True;self._sy_no_extra_close=True;self._sy_pinned_footer=self.buttons\n'
          assert current(auth).replace(added,'')==original(auth)
          def without_accessible_content(source):
              node=next(n for n in ast.parse(source).body if isinstance(n,ast.FunctionDef) and n.name=='accessible_content')
              lines=source.splitlines(keepends=True)
              return ''.join(lines[:node.lineno-1]+['ACCESSIBLE_CONTENT\n']+lines[node.end_lineno:])
          policy='standalone/pos2/popup_policy.py'
          assert without_accessible_content(current(policy))==without_accessible_content(original(policy))
          print('PASS: rc28 auth logic, business engine, private data and lottery unchanged; only compact popup presentation and version differ')
      - name: Install exact dependencies
        run: uv sync --frozen --extra dev --project standalone
      - name: Test confirmation layout, authentication, finances and other popup routes
        run: uv run --frozen --extra dev --project standalone python -m pytest -q standalone/tests/test_payment_access_layout.py standalone/tests/test_payment_reference_skins.py standalone/tests/test_payment_finance.py standalone/tests/test_popup_motion.py standalone/tests/test_fixed_query_resize.py standalone/tests/test_navigation_help.py standalone/tests/test_stock_management.py standalone/tests/test_personal_entry_contrast.py standalone/tests/test_lucky_sequence.py
      - name: Check 125 percent Windows scaling
        shell: pwsh
        run: |
          $env:QT_SCALE_FACTOR='1.25'
          uv run --frozen --extra dev --project standalone python -m pytest -q standalone/tests/test_payment_access_layout.py
          exit $LASTEXITCODE
      - name: Check 150 percent Windows scaling
        shell: pwsh
        run: |
          $env:QT_SCALE_FACTOR='1.5'
          uv run --frozen --extra dev --project standalone python -m pytest -q standalone/tests/test_payment_access_layout.py
          exit $LASTEXITCODE
      - name: Build and execute actual Windows EXE across all workflows
        run: uv run --frozen --extra dev --project standalone python standalone/build_portable.py
      - name: Package corresponding source
        run: uv run --frozen --extra dev --project standalone python standalone/package_source.py
      - name: Add clear versioned ASCII package names
        shell: python
        run: |
          from pathlib import Path
          from hashlib import sha256
          import shutil
          for kind,pattern in (('Windows-x64','*-Windows-x64-portable-*.zip'),('source','*-source-*.zip')):
              files=list(Path('standalone/dist').glob(pattern));assert len(files)==1
              target=Path('standalone/dist')/('SY-POS-v2.4.0rc29-'+kind+'-icons3d.zip')
              shutil.copyfile(files[0],target)
              target.with_suffix('.zip.sha256').write_text(sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: payment-access-native-captures
          if-no-files-found: warn
          path: |
            standalone/dist/SY-POS-Windows-smoke*.png
            standalone/dist/SY-POS-Windows-smoke*.log
      - uses: actions/upload-artifact@v4
        with:
          name: payment-access-verified-packages
          if-no-files-found: error
          path: |
            standalone/dist/SY-POS-v*-icons3d.zip
            standalone/dist/SY-POS-v*-icons3d.zip.sha256
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: payment-access-verified-packages
          path: release-assets
      - name: Verify ZIP checksums
        working-directory: release-assets
        run: sha256sum --check *.zip.sha256
      - name: Publish verified payment confirmation layout fix
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false --title "SY POS v2.4.0rc29 · 결제 사용자 확인창 정리" --notes-file standalone/RELEASE_NOTES.md release-assets/*.zip release-assets/*.zip.sha256
