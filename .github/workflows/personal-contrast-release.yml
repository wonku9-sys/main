name: Native personal entry contrast release
on:
  push:
    tags: ['personal-contrast-v*']
permissions:
  contents: read
  actions: read
jobs:
  windows:
    runs-on: windows-2022
    timeout-minutes: 20
    env:
      QT_QPA_PLATFORM: windows
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          architecture: x64
      - uses: astral-sh/setup-uv@v6
        with:
          version: '0.12.23'
          enable-cache: true
          cache-dependency-glob: standalone/uv.lock
      - name: Attest that only personal entry panel styles changed
        env:
          GH_TOKEN: ${{ github.token }}
        shell: python
        run: |
          import json,subprocess
          from pathlib import Path
          tested='8b7b2bc4193a0b219437e62aa8f0c61643a6cd63'
          run=json.loads(subprocess.check_output(['gh','api','repos/wonku9-sys/main/actions/runs/39539484529'],text=True,encoding='utf-8'))
          assert run['head_sha']==tested and run['conclusion']=='success'
          changed=set(subprocess.check_output(['git','diff','--name-only',tested,'HEAD','--','standalone/pos2'],text=True).splitlines())
          allowed={'standalone/pos2/'+name for name in ('__init__.py','diary_ui.py','household_ui.py')}
          assert changed<=allowed,changed-allowed
          def original(name):return subprocess.check_output(['git','show',tested+':'+name],text=True,encoding='utf-8')
          def current(name):return Path(name).read_text(encoding='utf-8')
          for name in ('standalone/pos2/__init__.py','standalone/pyproject.toml','standalone/uv.lock'):
              assert current(name).replace('2.4.0rc28','2.4.0rc27')==original(name),name
          for name in ('standalone/requirements.txt','standalone/build_portable.py','standalone/launch.py'):
              assert current(name)==original(name),name
          for kind,color,radius,space in (('diary','#F5F0FA',14,' '),('household','#FFF7EC',12,'')):
              name='standalone/pos2/'+kind+'_ui.py'
              old='        panel=QWidget();'+space+'panel.setStyleSheet("background:'+color+';border-radius:'+str(radius)+'px;")'
              new="        panel=QWidget();panel.setObjectName('"+kind+"EntryPanel')\n        panel.setStyleSheet(\"QWidget#"+kind+'EntryPanel {background:'+color+';border-radius:'+str(radius)+'px;}\")'
              assert current(name).replace(new,old)==original(name),name
          print('PASS: only two panel background selectors and version differ from verified rc27; data, passwords, locking, business engine, lottery and menu effects unchanged')
      - name: Install exact dependencies
        run: uv sync --frozen --extra dev --project standalone
      - name: Test rendered contrast, private records, popup policy and sequential lottery
        run: uv run --frozen --extra dev --project standalone python -m pytest -q standalone/tests/test_personal_entry_contrast.py standalone/tests/test_personal_real3d.py standalone/tests/test_personal_planning.py standalone/tests/test_popup_motion.py standalone/tests/test_lucky_sequence.py standalone/tests/test_unified_menu_effects.py
      - name: Build and execute actual Windows EXE across all workflows
        run: uv run --frozen --extra dev --project standalone python standalone/build_portable.py
      - name: Package corresponding source
        run: uv run --frozen --extra dev --project standalone python standalone/package_source.py
      - name: Add clear versioned ASCII package names
        shell: python
        run: |
          from pathlib import Path
          from hashlib import sha256
          import shutil
          for kind,pattern in (('Windows-x64','*-Windows-x64-portable-*.zip'),('source','*-source-*.zip')):
              files=list(Path('standalone/dist').glob(pattern));assert len(files)==1
              target=Path('standalone/dist')/('SY-POS-v2.4.0rc28-'+kind+'-icons3d.zip')
              shutil.copyfile(files[0],target)
              target.with_suffix('.zip.sha256').write_text(sha256(target.read_bytes()).hexdigest()+'  '+target.name+'\n',encoding='utf-8')
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: personal-contrast-native-captures
          if-no-files-found: warn
          path: |
            standalone/dist/SY-POS-Windows-smoke*.png
            standalone/dist/SY-POS-Windows-smoke*.log
      - uses: actions/upload-artifact@v4
        with:
          name: personal-contrast-verified-packages
          if-no-files-found: error
          path: |
            standalone/dist/SY-POS-v*-icons3d.zip
            standalone/dist/SY-POS-v*-icons3d.zip.sha256
  release:
    needs: windows
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: personal-contrast-verified-packages
          path: release-assets
      - name: Verify ZIP checksums
        working-directory: release-assets
        run: sha256sum --check *.zip.sha256
      - name: Publish verified personal menu readability fix
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ github.ref_name }}
        run: gh release create "$RELEASE_TAG" --verify-tag --prerelease --latest=false --title "SY POS v2.4.0rc28 · 개인 메뉴 글자 가독성 수정" --notes-file standalone/RELEASE_NOTES.md release-assets/*.zip release-assets/*.zip.sha256
